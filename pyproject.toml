[project]
name = "eventproof-gcp"
version = "0.1.0"
description = "Prospect-neutral operational event reliability proof for GCP"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools]
packages = ["eventproof"]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[tool.ruff]
line-length = 100
target-version = "py312"
