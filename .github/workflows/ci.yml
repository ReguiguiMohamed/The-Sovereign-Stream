name: local checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependency
        run: python -m pip install ".[test]"
      - name: Compile
        run: python -m compileall -q eventproof tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Flink MiniCluster tests
        run: mvn --batch-mode --file streaming/pom.xml verify
